/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mecanum_drive_controller:
        type: mecanum_drive_controller/MecanumDriveController

  mecanum_drive_controller:
    ros__parameters:
      reference_timeout: 1.5

      front_left_wheel_command_joint_name: fl_wheel_joint
      front_right_wheel_command_joint_name: fr_wheel_joint
      rear_left_wheel_command_joint_name: rl_wheel_joint
      rear_right_wheel_command_joint_name: rr_wheel_joint

      kinematics:
        wheels_radius: 0.04
        sum_of_robot_center_projection_on_X_Y_axis: 0.221

      base_frame_id: "base_footprint"
      odom_frame_id: "odom"
      enable_odom_tf: true

      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [3.3e-5, 3.3e-5, 0.0, 0.0, 0.0, 2.8e-3]

      use_stamped_vel: true