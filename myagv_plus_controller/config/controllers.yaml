/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mecanum_drive_controller:
        type: mecanum_drive_controller/MecanumDriveController


  mecanum_drive_controller:
    ros__parameters:
      front_left_wheel_command_joint_name: fl_wheel_joint
      front_right_wheel_command_joint_name: fr_wheel_joint
      rear_left_wheel_command_joint_name: rl_wheel_joint
      rear_right_wheel_command_joint_name: rr_wheel_joint

      kinematics:
        wheels_radius: 0.047
        sum_of_robot_center_projection_on_X_Y_axis: 0.149

      base_frame_id: base_link
      odom_frame_id: odom
      enable_odom_tf: false

      pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [3.3e-5, 3.3e-5, 0.0, 0.0, 0.0, 2.8e-3]

      cmd_vel_timeout: 0.5
      use_stamped_vel: true

      linear:
        x:
          max_velocity: 1.0
          min_velocity: -1.0
          max_acceleration: 0.75
          max_deceleration: -0.75
          max_acceleration_reverse: -0.75
          max_deceleration_reverse: 0.75
          max_jerk: .nan
          min_jerk: .nan

        y:
          max_velocity: 1.0
          min_velocity: -1.0
          max_acceleration: 0.75
          max_deceleration: -0.75
          max_acceleration_reverse: -0.75
          max_deceleration_reverse: 0.75
          max_jerk: .nan
          min_jerk: .nan

      angular:
        z:
          max_velocity: 3.14
          min_velocity: -3.14
          max_acceleration: 3.0
          max_deceleration: -3.0
          max_acceleration_reverse: -3.0
          max_deceleration_reverse: 3.0
          max_jerk: .nan
          min_jerk: .nan